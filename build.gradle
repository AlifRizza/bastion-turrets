plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// Dev-only tools (src/dev), loaded in every dev run but never part of the jar: /bastiondev commands, and the
// screenshot showcase (`./gradlew runClient -Pshowcase` builds a scene, saves run/screenshots/showcase_*.png, quits;
// `-Pshowcase=weapons` runs the Sniper / Rocket Launcher scene instead).
sourceSets {
    dev {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    devImplementation.extendsFrom implementation
    // Client-only dev mods: added to runClient alone, since they crash the server and GameTest runs.
    clientDevMods
    // -PwithPerfMods: server performance mods from a typical 1.20.1 modpack, to compare the stress scene with and without.
    perfMods
    // -PwithRenderMods: Embeddium + Oculus (shaders), as in most 1.20.1 modpacks; runClient only.
    renderMods
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // GeckoLib ships mixins; their refmap must be remapped to dev names.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                    source sourceSets.dev
                }
            }
        }

        client {
            if (project.hasProperty('showcase')) {
                def scene = project.findProperty('showcase')
                property 'bastion.showcase', scene ? scene : 'scene'
                if (project.hasProperty('stressCount')) property 'bastion.stressCount', project.findProperty('stressCount')
                // -Pjfr=<file>: Java Flight Recorder profile of the whole run (inspect with `jfr print`)
                if (project.hasProperty('jfr')) jvmArg "-XX:StartFlightRecording=filename=${project.findProperty('jfr')},settings=profile"
                // -PshowcaseWorld=<save folder> picks another world; run/saves/showcase holds the user's hand-built test rig
                args '--quickPlaySingleplayer', project.findProperty('showcaseWorld') ?: 'showcase', '--width', '1280', '--height', '720'
            }
        }

        server {
            args '--nogui'
        }

        // Runs every @GameTest in dev.bastion.gametest, then exits with the result.
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
            // Own world (run/world stays runServer's). The server saves its arenas' mobs and drops on exit and the next
            // run loaded them back into its tests (flaky drop and target counts), so their entities are wiped before each
            // run (below). The terrain is kept: generating a fresh world every run cost ~25 s and once hung on a vanilla
            // worldgen race (MissingPaletteEntryException in the light engine).
            args '--world', 'gametestworld'
        }
    }
}

// Dynamic lights hook LevelRenderer through a mixin (PLAN 5.5).
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

repositories {
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex('software\\.bernie.*')
            includeGroup('com.eliotlash.mclib')
        }
    }
    maven {
        name = 'Create'
        url = 'https://maven.createmod.net'
        content {
            includeGroup('com.simibubi.create')
            includeGroup('net.createmod.ponder')
            includeGroup('dev.engine-room.flywheel')
        }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup('maven.modrinth')
        }
    }
    maven {
        name = 'Registrate'
        url = 'https://maven.tterrag.com'
        content {
            includeGroup('com.tterrag.registrate')
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}")
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Optional Create compat (dev.bastion.compat.create): compiled against, loaded only when Create is installed.
    compileOnly fg.deobf("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    devCompileOnly fg.deobf("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    devCompileOnly fg.deobf("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}") { transitive = false }
    devCompileOnly fg.deobf("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}") { transitive = false }

    // Dev-only: Create in runClient to test belt/funnel/chute ammo automation (PLAN 9). Never a required dependency.
    runtimeOnly fg.deobf("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    runtimeOnly fg.deobf("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}")
    runtimeOnly fg.deobf("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}")
    runtimeOnly fg.deobf("com.tterrag.registrate:Registrate:${registrate_version}")
    runtimeOnly "io.github.llamalad7:mixinextras-forge:${mixinextras_version}"
    // Dev-only, runClient only: floating damage numbers + target health bar for testing turret damage.
    clientDevMods fg.deobf("maven.modrinth:torohealth-damage-indicators-updated:${torohealth_version}")
    // Modrinth version ids (Forge 1.20.1): Radium (Lithium port) 0.12.4, AI Improvements 0.5.2, ModernFix 5.27.85,
    // FerriteCore 6.0.1, Clumps 12.0.0.4.
    perfMods fg.deobf("maven.modrinth:radium:n947JjJH")
    perfMods fg.deobf("maven.modrinth:ai-improvements:eJihmpNQ")
    perfMods fg.deobf("maven.modrinth:modernfix:hHwYTQwa")
    perfMods fg.deobf("maven.modrinth:ferrite-core:DG5Fn9Sz")
    perfMods fg.deobf("maven.modrinth:clumps:nAHGB5ls")
    renderMods fg.deobf("maven.modrinth:embeddium:UTbfe5d1")  // 0.3.31+mc1.20.1
    renderMods fg.deobf("maven.modrinth:oculus:iQ1SwGc3")     // 1.20.1-1.8.0; shader pack in run/shaderpacks
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            geckolib_version_range: geckolib_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : "${mod_id}.mixins.json"
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// The stress scene measures FPS, so it runs without them (ToroHealth draws a bar over every husk); -PnoDevMods drops
// them too (clean screenshots for the store page).
tasks.matching { it.name == 'runClient' && project.findProperty('showcase') != 'stress' && !project.hasProperty('noDevMods') }.configureEach {
    runtimeClasspathArtifacts.from(configurations.clientDevMods)
    classpath(configurations.clientDevMods)
}

tasks.matching { it.name in ['runClient', 'runGameTestServer'] && project.hasProperty('withPerfMods') }.configureEach {
    runtimeClasspathArtifacts.from(configurations.perfMods)
    classpath(configurations.perfMods)
}

tasks.matching { it.name == 'runClient' && project.hasProperty('withRenderMods') }.configureEach {
    runtimeClasspathArtifacts.from(configurations.renderMods)
    classpath(configurations.renderMods)
}

tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst { delete 'run/gametestworld/entities' }
}

// Dev runs load src/dev (see sourceSets above), so compile it first.
tasks.matching { it.name in ['runClient', 'runServer', 'runGameTestServer'] }.configureEach {
    dependsOn 'devClasses'
}
